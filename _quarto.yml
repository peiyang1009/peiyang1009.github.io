project:
  type: website
  output-dir: docs
  resources:
    - "files/"
  render:
    - index.qmd
    - publications.qmd
    - contact.qmd
    - teaching.qmd
    - posts.qmd
    - media.qmd
    - notes.qmd
    - now.qmd
    - cn.qmd
    - notable-policy-citations.qmd
    - letters.qmd
    - 404.qmd

description-meta: "Wei Jin is an assistant professor at the School of Economics, Nankai University. His research interests include international economics, international trade, and international business."
author-meta: "Wei Jin"

website:
  title: "Wei Jin"
  description: "Wei Jin's personal academic website."
  site-url: "https://peiyang1009.github.io"
  repo-url: "https://github.com/peiyang1009/peiyang1009.github.io"

  navbar:
    background: light

    left:
      - text: About
        menu:
          - text: News
            href: posts.qmd#category=news
          - text: Events
            href: posts.qmd#category=event
          - text: Now
            href: now.qmd
          - text: Contact
            href: contact.qmd

      - text: Research
        menu:
          - text: List of Publications
            href: publications.qmd
          - text: Selected Papers
            href: posts.qmd#category=paper
          - text: Commentary
            href: posts.qmd#category=commentary
          - text: Recognition
            href: posts.qmd#category=recognition
          - text: Grants
            href: publications.qmd

      - text: Teaching
        href: teaching.qmd

      - text: Outreach
        menu:
          - text: Policy Engagement
            href: posts.qmd#category=outreach
          - text: Policy Citations
            href: notable-policy-citations.qmd
          - text: Presentations
            href: posts.qmd#category=presentation
          - text: Testimony
            href: posts.qmd#category=testimony
          - text: Media
            href: media.qmd
          - text: Notes
            href: notes.qmd

      - text: Other links
        href: https://weijinsite.weebly.com/
        target: _blank

      - text: 中文
        href: cn.qmd

    right:
      - text: "CV"
        href: files/Wei-Jin-CV.pdf
        target: _blank
      - icon: github
        href: https://github.com/peiyang1009/peiyang1009.github.io
        target: _blank
      - icon: globe
        href: https://weijinsite.weebly.com/
        target: _blank

  page-navigation: true

  page-footer:
    center: |
      [Wei Jin](https://peiyang1009.github.io) &copy; <script>document.write(new Date().getFullYear())</script>
      <span style="font-size: 0.9em; color: #888;">
        👤 Total visitors <span id="busuanzi_value_site_uv"></span>
        &nbsp; | &nbsp;
        👁️ Total views <span id="busuanzi_value_site_pv"></span>
      </span>
      <script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>

  search:
    location: navbar
    type: textbox

  reader-mode: false
  draft-mode: unlinked
  open-graph: true
  twitter-card: true

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    footnotes-hover: true
    code-copy: true
    code-link: true
    code-overflow: wrap
    fig-align: center
    link-external-icon: false
    link-external-newwindow: true
    email-obfuscation: javascript
