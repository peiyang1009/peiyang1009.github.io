project:
  type: website
  output-dir: docs
  resources:
    - "files/"
  render:
    - index.qmd
    - publications.qmd
    - contact.qmd

# Meta
description-meta: "Wei Jin's personal academic website."
author-meta: "Wei Jin"

website:
  title: "Wei Jin"
  description: "Wei Jin's personal academic website."
  site-url: "https://peiyang1009.github.io"
  repo-url: "https://github.com/peiyang1009/peiyang1009.github.io"

  navbar:
    background: light

    left:
      - text: Home
        href: index.qmd
      - text: Research
        href: publications.qmd
      - text: Contact
        href: contact.qmd

  page-navigation: true

  page-footer:
    center: "[Wei Jin](https://peiyang1009.github.io) &copy; <script>document.write(new Date().getFullYear())</script>"

  search:
    location: navbar
    type: textbox

  reader-mode: false
  draft-mode: unlinked

  open-graph: true
  twitter-card: true

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    footnotes-hover: true
    code-copy: true
    code-link: true
    code-overflow: wrap
    fig-align: center
    link-external-icon: false
    link-external-newwindow: true
    email-obfuscation: javascript
